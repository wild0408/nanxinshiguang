name: Android CI Build

on:
  workflow_dispatch:

jobs:
  build:
    environment: Release-Signing

    runs-on: ubuntu-latest

    steps:
      - name: 检出代码 (Checkout)
        uses: actions/checkout@v4

      - name: 清理索引和资源目标目录 (Clean Specific Resource Dirs)
        run: |
          # 强制删除 app/assets/offline_repo/index 和 schools 的内容
          rm -rf app/assets/offline_repo/index
          rm -rf app/assets/offline_repo/schools
          mkdir -p app/assets/offline_repo/index
          mkdir -p app/assets/offline_repo/schools

      - name: 克隆索引文件 (Clone Index PB File)
        run: |
          INDEX_PATH="app/assets/offline_repo/index"
          REPO_URL="https://${{ secrets.GITHUB_TOKEN }}@github.com/XingHeYuZhuan/shiguang_warehouse.git"
          
          echo "--- 正在克隆 index-pb-release 分支并获取 school_index.pb ---"
          
          # 临时目录用于克隆
          TEMP_CLONE_DIR=$(mktemp -d)
          
          # 浅克隆 index-pb-release 分支
          git clone --depth 1 --branch index-pb-release $REPO_URL $TEMP_CLONE_DIR
          
          # 移动文件到目标目录
          if [ -f $TEMP_CLONE_DIR/school_index.pb ]; then
            mv $TEMP_CLONE_DIR/school_index.pb $INDEX_PATH/
            echo "school_index.pb 成功下载到 $INDEX_PATH/"
          else
            echo "错误：未在 index-pb-release 分支中找到 school_index.pb，请检查仓库配置。"
            exit 1
          fi
          
          # 清理临时目录
          rm -rf $TEMP_CLONE_DIR

      - name: 克隆资源文件并清理 adapters.yaml (Clone Resources & Filter YAML)
        run: |
          SCHOOLS_PATH="app/assets/offline_repo/schools"
          REPO_URL="https://${{ secrets.GITHUB_TOKEN }}@github.com/XingHeYuZhuan/shiguang_warehouse.git"
          
          ABS_SCHOOLS_PATH=$(realpath $SCHOOLS_PATH)
          
          echo "--- 正在使用 sparse-checkout 克隆 main 分支下的 resources 目录 ---"

          # 临时目录用于稀疏克隆
          TEMP_CLONE_DIR=$(mktemp -d)
          
          # 步骤 1: 浅克隆仓库
          git clone --depth 1 --branch main $REPO_URL $TEMP_CLONE_DIR
          cd $TEMP_CLONE_DIR
          
          # 步骤 2: 切换到稀疏模式并设置只拉取 resources 目录
          git sparse-checkout init
          git sparse-checkout set resources
          
          
          # 步骤 3: 移动 resources 目录到目标位置 (使用绝对路径)
          if [ -d "resources" ]; then
            # 使用绝对路径 ABS_SCHOOLS_PATH 来确保 mv 目标正确
            mv resources $ABS_SCHOOLS_PATH/
            echo "resources 目录成功下载到 $SCHOOLS_PATH/"
          else
            echo "错误：稀疏检出失败。在 'main' 分支的根目录未找到或未检出 'resources' 目录。"
            exit 1
          fi
          
          echo "--- 正在清理所有 adapters.yaml 文件 (包括子目录) ---"
          
          # 步骤 4: 清理目标目录下的所有 adapters.yaml 文件 
          find $ABS_SCHOOLS_PATH/resources -name "adapters.yaml" -exec rm -f {} \;
          
          echo "资源克隆和清理完成。"
          
          # 返回工作目录并清理临时目录
          cd ${{ github.workspace }}
          rm -rf $TEMP_CLONE_DIR

      - name: 设置 JDK 21 (Setup JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 设置 Gradle 缓存 (Cache Gradle Dependencies)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 解码并准备签名密钥文件 (Decode and Prepare Signing Key)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::Release signing secrets are not configured."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nanxinshiguang-release.jks"
          echo "NANXINSHIGUANG_KEYSTORE_FILE=$RUNNER_TEMP/nanxinshiguang-release.jks" >> "$GITHUB_ENV"

      - name: 运行 Release 构建任务 (Build Release APK)
        env:
          NANXINSHIGUANG_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          NANXINSHIGUANG_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          NANXINSHIGUANG_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --no-configuration-cache --stacktrace

      - name: 上传构建产物到仓库 (Upload Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7
