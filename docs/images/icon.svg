          <rect x="164" y="135" width="16" height="6" rx="3"/>
          <rect x="216" y="135" width="16" height="6" rx="3"/>
          <rect x="268" y="135" width="16" height="6" rx="3"/>
          <rect x="320" y="135" width="16" height="6" rx="3"/>
          <rect x="372" y="135" width="16" height="6" rx="3"/>
        </g>
        <g stroke="#E9F0EE" stroke-width="2">
          <path d="M142 160 V392 M199 160 V392 M256 160 V392 M313 160 V392 M370 160 V392"/>
          <path d="M97 209 H412 M97 258 H412 M97 307 H412 M97 356 H412"/>
        </g>
        <g fill="#E2E9E7">
          <rect x="107" y="171" width="20" height="28" rx="4"/>
          <rect x="107" y="220" width="20" height="28" rx="4"/>
          <rect x="107" y="269" width="20" height="28" rx="4"/>
          <rect x="107" y="318" width="20" height="28" rx="4"/>
        </g>
        <g fill="#55C8C0">
          <rect x="327" y="169" width="59" height="34" rx="5"/>
          <rect x="327" y="218" width="59" height="34" rx="5"/>
          <rect x="327" y="267" width="59" height="34" rx="5"/>
          <rect x="327" y="316" width="59" height="34" rx="5"/>
          <rect x="154" y="365" width="49" height="30" rx="5"/>
        </g>
        <rect x="265" y="267" width="47" height="34" rx="5" fill="#FF9274"/>
        <rect x="265" y="316" width="47" height="34" rx="5" fill="#49A9E6"/>
