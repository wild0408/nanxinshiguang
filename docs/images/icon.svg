<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">南信拾光图标</title>
  <desc id="description">青绿到天蓝的圆角背景上，一张白色课程表卡片与环绕的时间轨迹。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#64E6A8"/>
      <stop offset="0.48" stop-color="#27D5B8"/>
      <stop offset="1" stop-color="#29A8ED"/>
    </linearGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.72"/>
      <stop offset="0.55" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E8FFFF" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F7FBF9"/>
    </linearGradient>
    <filter id="card-shadow" x="-20%" y="-20%" width="150%" height="160%">
      <feDropShadow dx="7" dy="12" stdDeviation="9" flood-color="#13769A" flood-opacity="0.29"/>
    </filter>
    <clipPath id="background-clip">
      <rect x="4" y="4" width="504" height="504" rx="71"/>
    </clipPath>
    <clipPath id="card-clip">
      <rect x="83" y="102" width="346" height="307" rx="37"/>
    </clipPath>
  </defs>

  <g clip-path="url(#background-clip)">
    <rect x="4" y="4" width="504" height="504" rx="71" fill="url(#background)"/>
    <path d="M311 57 C409 55 468 117 469 207 C471 328 348 440 194 468 C115 483 54 446 47 389 C38 332 64 278 106 250"
          fill="none" stroke="url(#orbit)" stroke-width="16" stroke-linecap="round"/>
    <circle cx="309" cy="57" r="13" fill="#FFFDF5"/>
    <circle cx="309" cy="57" r="9" fill="#FF9274"/>

    <g transform="rotate(-5 256 256)">
      <rect x="83" y="102" width="346" height="307" rx="37" fill="#FFFFFF" filter="url(#card-shadow)"/>
      <rect x="83" y="102" width="346" height="307" rx="37" fill="url(#card)"/>
      <g clip-path="url(#card-clip)">
        <path d="M83 160 H429" stroke="#E5EFED" stroke-width="2"/>
        <g fill="#D8E0DE">
